[project]
name = "flowup-fraud-detection"
version = "1.0.0"
description = "Real-time fraud detection microservice for FlowUp"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FlowUp Engineering", email = "engineering@flowup.com"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/models/trainer.py",
    "src/data/dataset_loader.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = [
    "S101",  # assert used in tests
    "S311",  # random not used for crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
